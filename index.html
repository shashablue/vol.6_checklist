<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成AIなんでも展示会 巡回チェック</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #101726;
      --bg-card-checked: #0b1c24;
      --border-color: #1e2d4a;
      --border-checked: #00ffcc44;
      --accent-cyan: #00f0ff;
      --accent-alert: #ff4b5c;
      --accent-amber: #ffb703;
      --accent-success: #00ffaa;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden; /* 横スクロールの発生を防止 */
    }

   /* 固定ヘッダー (スマホキーボード表示時もずれないよう fixed に変更) */
   .sticky-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      padding: 10px 12px 12px;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap; /* 小さい画面での崩れ防止 */
    }

    .app-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent-cyan);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-title::before {
      content: "■";
      color: var(--accent-alert);
      font-size: 0.7rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .counter-container {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .counter-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .counter-display {
      font-size: 1.1rem;
      font-weight: 900;
      font-family: "Courier New", Courier, monospace;
      color: #ffffff;
    }

    .counter-display .remaining-num {
      color: var(--accent-amber);
      text-shadow: 0 0 12px rgba(255, 183, 3, 0.6);
      font-size: 1.5rem;
    }

    /* プログレスバー */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #1a2333;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-success));
      box-shadow: 0 0 8px var(--accent-cyan);
      transition: width 0.3s ease;
    }

 
/* フィルター */
.filter-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    /* 検索クリアボタンの通常時（未使用時の薄い状態） */
    #clearSearchBtn {
      border-color: var(--border-color) !important;
      color: var(--text-muted) !important;
      transition: all 0.2s ease;
    }

    /* 検索クリアボタンにホバーしたとき（ほんのり明るく） */
    #clearSearchBtn:hover {
      border-color: rgba(0, 255, 170, 0.4) !important;
      color: var(--text-main) !important;
    }

    /* クリック時の一瞬の発光（アクティブ演出） */
    #clearSearchBtn.active-flash {
      border-color: var(--accent-success) !important;
      color: var(--accent-success) !important;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
    }

    .filter-btn {
      background: #131d2e;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* 検索バー */
    .search-container {
      padding: 4px 0;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: #101726;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

   /* PC・タブレットなど幅が広い画面用の横並びレイアウト */
   @media (min-width: 640px) {
      .header-bottom-row {
        display: flex;
        align-items: center;
        justify-content: flex-start; /* ★左寄せにして検索クリアボタンの隣に配置 */
        gap: 12px;                  /* ★ボタンと検索バーの間の余白 */
        margin-top: 6px;
      }

      .search-container {
        padding: 0;
        flex: 1;           /* ★検索クリアの隣から右側の空きスペースを活用して広がる */
        max-width: 400px;  /* ★広がりすぎないよう上限を設定（お好みで調整可） */
      }
    }


    /* スマホ（画面幅768px以下）の時だけ拡大防止のために16pxにする */
    @media (max-width: 768px) {
  .search-input {
    font-size: 16px;
  }
}   
    .search-input:focus {
      border-color: var(--accent-cyan);
    }

   /* メインコンテンツ (ヘッダーに被らないよう上部にマージンを追加) */
   .main-container {
      padding: 8px 12px;
      max-width: 800px;
      margin: 220px auto 0; /* ★固定ヘッダーの高さを考慮して上部余白を設定 */
    }

    /* スマホ（縦画面）で見やすい1列配置レイアウト */
    .booth-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* PCなど画面幅が広い場合のみ2列表示 */
    @media (min-width: 640px) {
      .booth-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .booth-card {
  background: var(--bg-card);
  /* 枠線の色を rgba で半透明にして落ち着いた印象に */
  border: 1px solid rgba(0, 243, 255, 0.3);
  border-radius: 8px;
  padding: 12px 12px 12px 15px; /* サイズ維持用のパディング */
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: all 0.25s ease;
  /* 周囲の上品なサイバー発光感はそのまま維持 */
  box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
}

.booth-card.checked {
      /* 背景に半透明の鮮やかな緑（サイバーグリーン）を重ねる */
      background: linear-gradient(rgba(10, 255, 178, 0.80), rgba(10, 255, 178, 0.15)), var(--bg-card-visited);
      border: 1px solid var(--accent-green); /* 枠線全体を鮮やかなグリーンに */
      box-shadow: 0 0 12px rgba(10, 255, 178, 0.4); /* グリーンのサイバー発光 */
      opacity: 0.5;
    }

    .booth-info {
      flex: 1;
      min-width: 0;
    }

    .booth-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .booth-id {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      display: inline-block;
    }

    .booth-name {
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .booth-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* タップしやすいボタン設計 */
    .check-btn {
      background: #162438;
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      min-width: 80px;
      text-align: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .check-btn:active {
      transform: scale(0.95);
    }

    .booth-card.checked .check-btn {
      background: #0d382e;
      color: var(--accent-success);
      border-color: var(--accent-success);
    }

    /* モーダル表示 */
    .report-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      animation: fadeIn 0.2s ease-out;
    }

    .report-card {
      background: var(--bg-card, #101726);
      border: 1px solid var(--accent-purple, #7928ca);
      box-shadow: 0 10px 30px rgba(121, 40, 202, 0.3), 0 0 20px rgba(0, 240, 255, 0.1);
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      text-align: center;
      color: var(--text-main, #e2e8f0);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .report-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .report-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #c084fc;
      letter-spacing: 0.05em;
    }

    .report-stats {
      display: flex;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color, #1e2d4a);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted, #64748b);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 800;
      font-family: "Courier New", Courier, monospace;
    }

    .stat-value.highlight {
      color: var(--accent-cyan, #00f0ff);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .stat-unit {
      font-size: 0.8rem;
      color: var(--text-muted, #64748b);
    }

    .report-message {
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 20px;
      padding: 0 4px;
      word-break: break-word;
    }

    .report-close-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #7928ca, #4a148c);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .report-close-btn:active {
      opacity: 0.8;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  /* 音声ONのとき：オレンジの背景、枠線、文字色 */
     #voiceToggleBtn.voice-active {
      background: rgba(255, 183, 3, 0.2) !important;
      border-color: var(--accent-amber) !important;
      color: var(--accent-amber) !important;
    }

    /* 音声OFFのとき：背景を透明にし、枠線と文字色だけを残す */
        #voiceToggleBtn:not(.voice-active) {
      background: transparent !important;
      border-color: rgba(255, 255, 255, 0.3) !important;
      color: var(--text-muted) !important;
    }

    /* ボタンが押されたときの凹みアニメーション */
    button:active, .filter-btn:active, .pressed {
      transform: scale(0.92) !important;
      opacity: 0.8;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.4) !important;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
  </style>
</head>
<body>

  <!-- 固定ヘッダー -->
  <header class="sticky-header">
    <div class="header-top">
      <div class="app-title">生成AIなんでも展示会 vol.6</div>
      <div class="header-controls">
        <button id="mapBtn" class="filter-btn" style="border-color: var(--accent-cyan); color: var(--accent-cyan);">会場マップ</button>
        <button id="voiceToggleBtn" class="filter-btn voice-active">音声: ON</button>
        <button id="returnBtn" class="filter-btn" style="border-color: #7928ca; color: #c084fc;">帰還</button>
        <button id="resetBtn" class="filter-btn" style="border-color: var(--accent-alert); color: var(--accent-alert);">巡回初期化</button>
      </div>
    </div>

    <div class="counter-container">
      <div class="counter-label">未巡回ブース</div>
      <div class="counter-display">
        残り <span id="remainingCount" class="remaining-num">0</span> / <span id="totalCount">0</span>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
  

  <!-- フィルターと検索バーを横並びにするための囲み要素を追加 -->
    <div class="header-bottom-row">
      <!-- 絞り込みフィルター -->
      <div class="filter-container" id="filterContainer">
        <button class="filter-btn active" data-filter="all">全出展者</button>
        <button class="filter-btn" data-filter="unvisited">未巡回のみ</button>
        <button class="filter-btn" id="scrollTopBtn" style="border-color: var(--accent-cyan); color: var(--accent-cyan);">▲ TOP</button>
        <button class="filter-btn" id="clearSearchBtn">検索クリア</button>
      </div>

      <!-- 検索バー -->
      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="出展者名やキーワードで検索...">
      </div>
    </div>

</header>

  <!-- ブースリスト -->
  <main class="main-container">
    <div class="booth-list" id="boothList"></div>
  </main>

  <!-- 帰還レポート用モーダルカード -->
  <div id="reportModal" class="report-modal-overlay" style="display: none;">
    <div class="report-card">
      <div class="report-header">
        <span class="report-icon">📊</span>
        <h3 class="report-title">巡回状況リポート</h3>
      </div>
      <div class="report-stats">
        <div class="stat-item">
          <span class="stat-label">確認済み</span>
          <span id="modalVisited" class="stat-value">0</span>
          <span class="stat-unit">/ <span id="modalTotal">0</span> 件</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">達成率</span>
          <span id="modalRate" class="stat-value highlight">0%</span>
        </div>
      </div>
      <p id="modalMessage" class="report-message"></p>
      <button id="closeModalBtn" class="report-close-btn">確認して閉じる</button>
    </div>
  </div>
  <!-- 巡回初期化確認用モーダルカード（ここに追加します） -->
  <div id="resetModal" class="report-modal-overlay" style="display: none;">
    <div class="report-card" style="border-color: var(--accent-alert);">
      <div class="report-header">
        <span class="report-icon">⚠️</span>
        <h3 class="report-title" style="color: var(--accent-alert);">巡回データのリセット</h3>
      </div>
      <p id="resetModalMessage" class="report-message">
        これまでの巡回チェックをすべて初期化しますか？<br>この操作は取り消せません。
      </p>
      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button id="cancelResetBtn" class="filter-btn" style="flex: 1; padding: 12px; font-size: 0.9rem;">キャンセル</button>
        <button id="confirmResetBtn" class="report-close-btn" style="flex: 1; background: linear-gradient(135deg, #ff4b5c, #990011);">初期化する</button>
      </div>
    </div>
  </div>

    function speak(text) {
      if (!isVoiceEnabled) return;
      if (!('speechSynthesis' in window)) return;

      // 既存の再生をキャンセル
      window.speechSynthesis.cancel();

      // iOSのタイミングバグ・Androidの読み込み遅延を防ぐため50ミリ秒遅延させて再生
      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        // 日本語音声を明示的に割り当てる（Android・iOS両対応）
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
          const jaVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.startsWith('ja'));
          if (jaVoice) {
            utterance.voice = jaVoice;
          }
        }

        window.speechSynthesis.speak(utterance);
      }, 50);
    }

      const progressPercent = total > 0 ? (checkedCount / total) * 100 : 0;

    function toggleBooth(id, name) {
      const key = `${id}_${name}`;
      const booth = boothMasterData.find(b => b.id === id && b.name === name);
      const isChecked = checkedBoothIds.has(key);

      if (isChecked) {
        checkedBoothIds.delete(key);
        const remaining = boothMasterData.length - checkedBoothIds.size;
        speak(`${booth ? booth.name : name}の巡回を解除しました。残り${remaining}箇所です。`);
      } else {
        checkedBoothIds.add(key);
        const remaining = boothMasterData.length - checkedBoothIds.size;
        if (remaining === 0) {
          speak(`全ブースの巡回が完了しました！お疲れ様でした！`);
        } else {
          speak(`${booth ? booth.name : name}巡回！残り${remaining}箇所です。`);
        }
      }

      saveState();
      updateCounter();
      renderBooths();
    }

          const matchName = booth.name.toLowerCase().includes(q);
          const matchId = booth.id.toLowerCase().includes(q);
          const matchCategory = booth.category ? booth.category.toLowerCase().includes(q) : false;
          const matchTags = booth.tags ? booth.tags.some(tag => tag.toLowerCase().includes(q)) : false;
          return matchName || matchId || matchCategory || matchTags;
        }

        return true;
      });

      if (filteredBooths.length === 0) {
        boothListEl.innerHTML = `<div style="text-align:center; padding: 30px 10px; color: var(--text-muted);">該当する出展者が見つかりません</div>`;
        return;
      }

      filteredBooths.forEach(booth => {
        const itemKey = `${booth.id}_${booth.name}`;
        const isChecked = checkedBoothIds.has(itemKey);
        const safeName = booth.name.replace(/'/g, "\\'");
        const tagsText = booth.tags && booth.tags.length > 0 ? booth.tags.join(', ') : booth.category;

        const card = document.createElement('div');
        card.className = `booth-card ${isChecked ? 'checked' : ''}`;

        card.innerHTML = `
          <div class="booth-info">
            <div class="booth-header">
              <span class="booth-id">${booth.id}</span>
            </div>
            <div class="booth-name" title="${booth.name}">${booth.name}</div>
            <div class="booth-desc" title="${tagsText}">${tagsText}</div>
          </div>
          <button class="check-btn" onclick="toggleBooth('${booth.id}', '${safeName}')">
            ${isChecked ? '巡回済' : '巡回する'}
          </button>
        `;
        boothListEl.appendChild(card);
      });
    }

    filterContainer.addEventListener('click', (e) => {
  // data-filter 属性を持つボタンだけアクティブ切り替えを行う
  if (e.target.classList.contains('filter-btn') && e.target.hasAttribute('data-filter')) {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => btn.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.getAttribute('data-filter');
    renderBooths();
  }
});
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderBooths();
    });

// 検索クリアボタンの処理
const clearSearchBtn = document.getElementById('clearSearchBtn');
    if (clearSearchBtn) {
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        renderBooths();

        // クリック時の一瞬の発光アニメーション
        clearSearchBtn.classList.add('active-flash');
        setTimeout(() => {
          clearSearchBtn.classList.remove('active-flash');
        }, 300); // 0.3秒後に元の薄い状態に戻る
      });
    }

    // リセットモーダル要素
    const resetModal = document.getElementById('resetModal');
    const cancelResetBtn = document.getElementById('cancelResetBtn');
    const confirmResetBtn = document.getElementById('confirmResetBtn');
    const resetModalMessage = document.getElementById('resetModalMessage');

    // 「巡回初期化」ボタンクリックで確認モーダル表示
    resetBtn.addEventListener('click', () => {
        resetBtn.classList.add('pressed'); setTimeout(() => resetBtn.classList.remove('pressed'), 150);
      resetModalMessage.innerHTML = 'これまでの巡回チェックをすべて初期化しますか？<br>この操作は取り消せません。';
      confirmResetBtn.style.display = 'block';
      confirmResetBtn.textContent = '初期化する';
      resetModal.style.display = 'flex';
    });

    // キャンセルボタン
    cancelResetBtn.addEventListener('click', () => {
      resetModal.style.display = 'none';
    });

    // モーダル背景クリックで閉じる
    resetModal.addEventListener('click', (e) => {
      if (e.target === resetModal) resetModal.style.display = 'none';
    });

    // 「初期化する」実行ボタン
    confirmResetBtn.addEventListener('click', () => {
      checkedBoothIds.clear();
      saveState();
      updateCounter();
      renderBooths();
      speak('巡回データを初期化しました。');

      // 完了メッセージに切り替えて閉じる準備
      resetModalMessage.textContent = '巡回データを初期化しました。';
      confirmResetBtn.style.display = 'none'; // 実行ボタンを隠す
      
      setTimeout(() => {
        resetModal.style.display = 'none';
      }, 1200);
    });

    updateCounter();
    renderBooths();

    // ★ここに「TOPへ戻る」ボタンの処理を追加します
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    if (scrollTopBtn) {
      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }
  </script>
</body>
</html>
  </script>
