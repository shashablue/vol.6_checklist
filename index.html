<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成AIなんでも展示会 ブース巡回チェッカー</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #101726;
      --bg-card-checked: #0b1c24;
      --border-color: #1e2d4a;
      --border-checked: #00ffcc44;
      --accent-cyan: #00f0ff;
      --accent-alert: #ff4b5c;
      --accent-amber: #ffb703;
      --accent-success: #00ffaa;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* 固定ヘッダー */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      padding: 12px 16px;
    }
    /* ヘッダー上部のレイアウト調整 */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .app-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--accent-cyan);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-title::before {
      content: "■";
      color: var(--accent-alert);
      font-size: 0.7rem;
    }
    /* 音声ボタンと初期化ボタンを横並びにするコンテナ */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .counter-container {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .counter-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .counter-display {
      font-size: 1.4rem;
      font-weight: 900;
      font-family: "Courier New", Courier, monospace;
      color: #ffffff;
    }

    .counter-display .remaining-num {
      color: var(--accent-amber);
      text-shadow: 0 0 12px rgba(255, 183, 3, 0.6);
      font-size: 1.8rem;
    }

    /* プログレスバー */
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #1a2333;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-success));
      box-shadow: 0 0 8px var(--accent-cyan);
      transition: width 0.3s ease;
    }

    /* フィルター */
    .filter-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 12px 16px 4px;
      scrollbar-width: none;
    }
    .filter-container::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: #131d2e;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 4px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* 検索バー */
    .search-container {
      padding: 8px 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      background: #101726;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    /* メインコンテンツ */
    .main-container {
      padding: 12px 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ブースグリッド：最初からスマホ含め2列（横並び）にする */
    .booth-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px; /* スマホ向けに隙間を少し狭める */
    }

    /* ブースカード：2列並びでも崩れないようコンパクトに調整 */
    .booth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 6px;
      padding: 8px 10px; /* 余白を縮小 */
      display: flex;
      flex-direction: column; /* 2列用に縦長レイアウトへ変更 */
      justify-content: space-between;
      gap: 8px;
      transition: all 0.25s ease;
    }

    /* ブースカード */
    .booth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .booth-card.checked {
      background: var(--bg-card-checked);
      border-color: var(--border-checked);
      border-left: 4px solid var(--accent-success);
      opacity: 0.75;
    }

    .booth-info {
      flex: 1;
      min-width: 0;
    }

    .booth-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .booth-id {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .booth-name {
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .booth-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ボタン */
    .check-btn {
      background: #162438;
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      min-width: 88px;
      text-align: center;
      transition: all 0.2s;
    }

    .check-btn:active {
      transform: scale(0.95);
    }

    .booth-card.checked .check-btn {
      background: #0d382e;
      color: var(--accent-success);
      border-color: var(--accent-success);
    }

    /* フッター */
    .footer-actions {
      margin-top: 30px;
      text-align: center;
    }

    .reset-btn {
      background: transparent;
      border: 1px dashed var(--accent-alert);
      color: var(--accent-alert);
      padding: 10px 20px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>

    <div class="header-top">
      <div class="app-title">生成AIなんでも展示会 vol.6</div>
      <!-- 音声ボタンと初期化ボタンを横並びに配置 -->
      <div class="header-controls">

        <button id="returnBtn" class="filter-btn" style="border-color: var(--accent-purple); color: #c084fc;">🚀 帰還</button>
        <button id="resetBtn" class="filter-btn" style="border-color: var(--accent-alert); color: var(--accent-alert);">巡回初期化</button>
      </div>
    </div>

    
    <div class="counter-container">
      <div class="counter-label">未確認ブース</div>
      <div class="counter-display">
        残り <span id="remainingCount" class="remaining-num">0</span> / <span id="totalCount">0</span>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
  </header>

  <!-- 絞り込みフィルター -->
  <div class="filter-container" id="filterContainer">
    <button class="filter-btn active" data-filter="all">全出展者</button>
    <button class="filter-btn" data-filter="unvisited">未確認のみ</button>

    <input type="text" id="searchInput" class="search-input" placeholder="出展者名やキーで検索...">

          message = `お疲れ様です。達成率は${rate}%です。徐々にエンジンがかかってきました！`;
        } else if (rate < 40) {
          message = `お疲れ様です。達成率は${rate}%です。順調にチェックが進んでいます。`;
        } else if (rate < 50) {
          message = `お疲れ様です。達成率は${rate}%です。もうすぐ折り返し地点ですね！`;
        } else if (rate < 60) {
          message = `お疲れ様です。達成率は${rate}%です。半分を突破しました！この調子です。`;
        } else if (rate < 70) {
          message = `お疲れ様です。達成率は${rate}%です。後半戦も良いペースで巡回できています。`;
        } else if (rate < 80) {
          message = `お疲れ様です。達成率は${rate}%です。かなり巡回が進みましたね！`;
        } else if (rate < 90) {
          message = `お疲れ様です。達成率は${rate}%です。ゴールが見えてきました！`;
        } else if (rate < 100) {
          message = `お疲れ様です。達成率は${rate}%です。残りあとわずか、コンプリート目前です！`;
        } else {
          message = `素晴らしい！全${total}件の巡回を完了しました！本日のミッション完全達成です。お疲れ様でした！`;
        }

        // 1. 画面上にダイアログを表示
        alert(`【巡回状況リポート】\n全${total}件中 ${visited}件確認（達成率: ${rate}%）\n\n${message}`);

        // 2. 音声で読み上げ
        speak(message);
      });
    }
    // 音声読み上げ (Web Speech API)
    function speak(text) {
  if (!isVoiceEnabled) return; // 音声OFFのときは再生しない
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'ja-JP';
  utterance.rate = 1.15;
  utterance.pitch = 1.0;
  window.speechSynthesis.speak(utterance);
    }

    // カウント更新
    function updateCounter() {
      const total = boothMasterData.length;
      const checkedCount = checkedBoothIds.size;
      const remaining = total - checkedCount;

      totalCountEl.textContent = total;
      remainingCountEl.textContent = remaining;

      const progressPercent = total > 0 ? (checkedCount / total) * 100 : 0;
      progressBarEl.style.width = `${progressPercent}%`;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(checkedBoothIds)));
    }

    // チェック切り替え
function toggleBooth(id, name) {
  // ブースIDと出展者名を組み合わせて一意のキーを作成（例: "F-3/F-4_PoTeto"）
  const key = `${id}_${name}`;
  
  // 対象の出展者データを特定
  const booth = boothMasterData.find(b => b.id === id && b.name === name);
  const isChecked = checkedBoothIds.has(key);

  if (isChecked) {
    checkedBoothIds.delete(key);
    const remaining = boothMasterData.length - checkedBoothIds.size;
    speak(`${booth ? booth.name : name}の巡回を解除しました。残り${remaining}箇所です。`);
  } else {
    checkedBoothIds.add(key);
    const remaining = boothMasterData.length - checkedBoothIds.size;
    if (remaining === 0) {
      speak(`全ブースの巡回が完了しました！お疲れ様でした！`);
    } else {
      speak(`${booth ? booth.name : name}巡回！残り${remaining}箇所です。`);
    }
  }

      saveState();
      updateCounter();
      renderBooths();
    }

// ブース描画
function renderBooths() {
  boothListEl.innerHTML = '';

  const filteredBooths = boothMasterData.filter(booth => {
    // ブースIDと出展者名を組み合わせた一意のキーを作成
    const itemKey = `${booth.id}_${booth.name}`;

    // フィルター判定（一意のキーで未訪問チェック）
    if (currentFilter === 'unvisited' && checkedBoothIds.has(itemKey)) return false;
    
    // 検索キーワード判定
    if (searchQuery.trim() !== '') {
      const q = searchQuery.toLowerCase();
      const matchName = booth.name.toLowerCase().includes(q);
      const matchId = booth.id.toLowerCase().includes(q);
      const matchCategory = booth.category ? booth.category.toLowerCase().includes(q) : false;
      const matchTags = booth.tags ? booth.tags.some(tag => tag.toLowerCase().includes(q)) : false;
      return matchName || matchId || matchCategory || matchTags;
    }

    return true;
  });

  if (filteredBooths.length === 0) {
    boothListEl.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">該当する出展者が見つかりません</div>`;
    return;
  }

  filteredBooths.forEach(booth => {
    // 一意のキーで判定とボタン呼び出しを行う
    const itemKey = `${booth.id}_${booth.name}`;
    const isChecked = checkedBoothIds.has(itemKey);

    // シングルクォート等によるJS構文エラーを防ぐエスケープ処理
    const safeName = booth.name.replace(/'/g, "\\'");

    // タグ表示用のテキスト作成（タグがない場合はカテゴリー名を表示）
    const tagsText = booth.tags && booth.tags.length > 0 ? booth.tags.join(', ') : booth.category;

    const card = document.createElement('div');
    card.className = `booth-card ${isChecked ? 'checked' : ''}`;

    card.innerHTML = `
      <div class="booth-info">
        <div class="booth-header">
          <span class="booth-id">${booth.id}</span>
        </div>
        <div class="booth-name" title="${booth.name}">${booth.name}</div>
        <div class="booth-desc" title="${tagsText}">${tagsText}</div>
      </div>
      <button class="check-btn" onclick="toggleBooth('${booth.id}', '${safeName}')">
        ${isChecked ? '✓ 巡回済' : '巡回する'}
      </button>
    `;
    boothListEl.appendChild(card);
  });
}
    // フィルターイベント
    filterContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-filter');
        renderBooths();
      }
    });

    // 検索イベント
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderBooths();
    });

    // リセットイベント
    resetBtn.addEventListener('click', () => {
      if (confirm('巡回チェックをすべてリセットしますか？')) {
        checkedBoothIds.clear();
        saveState();
        updateCounter();
        renderBooths();
        speak('巡回データを初期化しました。');
      }
    });

    // 初期実行
    updateCounter();
    renderBooths();
  </script>
</body>
</html>
